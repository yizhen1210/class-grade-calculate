<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>608成績計算</title>

    <!-- PWA / 桌面圖示：三張 PNG 與此檔同目錄一起上傳，檔名須與 manifest 一致 -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
    <meta name="theme-color" content="#8c7768">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Iansui&display=swap" rel="stylesheet">

    <style>
        /* ---- 全站設計變數：顏色一律用變數，勿寫死 ---- */
        :root {
            --bg: #e8e4da;          /* 頁面底色 */
            --surface: #ffffff;     /* 卡片/輸入框底 */
            --text: #332b24;        /* 主文字 */
            --muted: #a39a8e;       /* 次要/placeholder */
            --accent-rgb: 140,119,104;            /* 主色 RGB（改這裡即可，其餘自動跟隨）－取自 icon 的深咖啡色 */
            --accent: rgb(var(--accent-rgb));     /* 主色（按鈕、邊框、focus） */
            --focus-glow: color-mix(in srgb, var(--accent) 50%, transparent); /* focus 光暈：自動＝主色 */
            --accent-dark: color-mix(in srgb, var(--accent) 82%, #000); /* 主色 hover：自動加深 */
            --line: #d8d1c4;        /* 分隔線/淺邊框 */
            --danger: #c4674f;      /* 刪除/警示 */
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Iansui', system-ui, sans-serif;
            margin: 0; min-height: 100vh;
            background: var(--bg); color: var(--text);
            -webkit-font-smoothing: antialiased;
            zoom: 1.3; /* 畫面等比放大 */
        }

        /* ---- 載入 gate：首次資料到齊前隱藏會變動的內容，避免預設值閃現 ---- */
        body:not(.ready) [data-gated] { visibility: hidden; }

        /* ---- 彈窗 base（所有 app 共用這組命名，勿改名） ---- */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: var(--surface); border: 3px solid var(--line); padding: 36px 44px; border-radius: 20px; text-align: center; box-shadow: 0 20px 55px rgba(0,0,0,0.4); width: min(520px, 90vw); }
        .modal-title { font-size: 1.4em; margin: 0 0 22px; }
        .modal-content input { display: block; width: 100%; margin: 0 0 24px; padding: 12px 18px; border: 2px solid var(--line); border-radius: 14px; font-family: inherit; font-size: 1.1em; outline: none; text-align: center; background: var(--surface); color: var(--text); }
        .modal-content input::placeholder { color: var(--muted); }
        .modal-input { display: block; width: 100%; margin: 0 0 24px; padding: 12px 18px; border: 2px solid var(--line); border-radius: 14px; font-family: inherit; font-size: 1.1em; outline: none; text-align: center; background: var(--surface); color: var(--text); }
        .modal-input::placeholder { color: var(--muted); }
        .modal-input:focus { border-color: var(--accent); box-shadow: 0 0 12px 3px var(--focus-glow); }
        .modal-content input:focus { border-color: var(--accent); box-shadow: 0 0 12px 3px var(--focus-glow); }
        .modal-hint { display: none; margin: -14px 0 18px; font-size: 0.9em; color: var(--danger); }
        .modal-actions { display: flex; justify-content: center; gap: 18px; }
        .modal-actions button { padding: 11px 38px; border-radius: 50px; cursor: pointer; font-family: inherit; font-size: 1.15em; border: 2px solid var(--accent); }
        .btn-ok { background: var(--accent); color: #fff; }
        .btn-ok:hover { background: var(--accent-dark); }
        .btn-cancel { background: #f2f8f9; color: var(--accent); }
        .btn-cancel:hover { background: var(--accent); color: #fff; }
        @media (max-width: 640px) {
            .modal-content { padding: 26px 22px; width: min(420px, 88vw); }
            .modal-title { white-space: nowrap; }
        }

        /* ---- 一般按鈕 ---- */
        .btn { padding: 9px 22px; border-radius: 50px; border: 2px solid var(--accent); background: var(--accent); color: #fff; font-family: inherit; font-size: 1em; cursor: pointer; transition: background 0.15s, color 0.15s, border-color 0.15s; }
        .btn:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
        .btn.outline { background: transparent; color: var(--accent); }
        .btn.outline:hover { background: var(--accent); color: #fff; }
        .btn.small { padding: 5px 14px; font-size: 0.85em; }
        .btn.danger { border-color: var(--danger); background: var(--danger); }
        .btn.danger:hover { background: color-mix(in srgb, var(--danger) 80%, #000); border-color: color-mix(in srgb, var(--danger) 80%, #000); }
        .icon-btn { border: 1px solid var(--line); background: transparent; color: var(--accent); cursor: pointer; font-size: 0.9em; vertical-align: middle; padding: 0; border-radius: 50%; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; transition: background 0.15s, color 0.15s; }
        .icon-btn:hover { background: var(--accent); color: #fff; }
        .hidden { display: none; }

        .admin-only.hidden { display: none; }

        /* ---- 業務樣式 ---- */
        header { border-bottom: 2px solid var(--line); padding: 14px 16px; }
        .header-inner { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; max-width: 1100px; margin: 0 auto; }
        .header-side { display: flex; align-items: center; }
        .header-actions { justify-self: end; }
        .header-title { justify-self: center; text-align: center; }
        .header-title h1 { font-size: 2.1em; margin: 0; white-space: nowrap; }
        main, #adminArea { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }

        .empty-note { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 1.1em; }

        .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
        .tab-btn { padding: 8px 20px; border-radius: 50px; border: 2px solid var(--line); background: var(--surface); color: var(--text); font-family: inherit; cursor: pointer; font-size: 0.95em; transition: background 0.15s, border-color 0.15s, color 0.15s; }
        .tab-btn:hover { border-color: var(--accent); color: var(--accent-dark); }
        .tab-btn.active { border-color: var(--accent); background: var(--accent); color: #fff; }
        .tab-btn.active:hover { background: var(--accent-dark); color: #fff; }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        .subtabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
        .subtabs-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
        .subtabs-row .subtabs { margin-bottom: 0; }
        .subtabs-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .subtab-btn { padding: 6px 16px; border-radius: 50px; border: 2px solid var(--line); background: var(--surface); color: var(--text); font-family: inherit; cursor: pointer; font-size: 0.88em; transition: background 0.15s, border-color 0.15s, color 0.15s; }
        .subtab-btn:hover { border-color: var(--accent-dark); }
        .subtab-btn.active { border-color: var(--accent-dark); background: color-mix(in srgb, var(--accent) 18%, var(--surface)); color: var(--accent-dark); font-weight: bold; }

        .toolbar { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
        .toolbar select, .toolbar input[type=text] { padding: 8px 14px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); color: var(--text); font-family: inherit; font-size: 0.95em; }
        .toolbar label { font-size: 0.9em; color: var(--muted); }

        .table-wrap { overflow-x: auto; border: 2px solid var(--line); border-radius: 14px; background: var(--surface); }
        table.grid { border-collapse: collapse; width: 100%; min-width: 560px; }
        table.grid th, table.grid td { padding: 8px 10px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
        table.grid th { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); font-weight: normal; color: var(--text); position: sticky; top: 0; }
        table.grid td.name-cell { text-align: center; font-weight: bold; }
        table.grid tr:last-child td { border-bottom: none; }
        table.grid input[type=number] { width: 74px; padding: 6px 4px; border: 2px solid var(--line); border-radius: 8px; text-align: center; font-family: inherit; font-size: 0.95em; background: var(--surface); color: var(--text); }
        table.grid input[type=number]:focus { border-color: var(--accent); box-shadow: 0 0 8px 2px var(--focus-glow); outline: none; }
        table.grid input[type=text] { padding: 6px 10px; border: 2px solid var(--line); border-radius: 8px; font-family: inherit; font-size: 0.95em; background: var(--surface); color: var(--text); width: 120px; text-align: center; }
        table.grid input[type=text]:focus { border-color: var(--accent); box-shadow: 0 0 8px 2px var(--focus-glow); outline: none; }
        table.grid th input[type=text] { display: inline-block; margin: 0; text-align: center; }
        /* 名稱框＋刪除鈕包成一組，這組整體在儲存格內置中；置中只看這組(其實就是輸入框本身)的寬度，
           刪除鈕用絕對定位貼在這組的右上角，不會被拉到儲存格最右邊 */
        .col-name-wrap { position: relative; display: inline-block; }
        td.derived { font-weight: bold; color: var(--accent-dark); }
        td.rank-cell { font-weight: bold; }
        .col-del-btn { border: none; background: var(--surface); color: var(--danger); cursor: pointer; font-size: 0.75em; border-radius: 50%; width: 18px; height: 18px; transition: background 0.15s; position: absolute; top: -8px; right: -8px; line-height: 1; padding: 0; box-shadow: 0 0 0 1px var(--line); }
        .col-del-btn:hover { background: var(--danger); color: #fff; box-shadow: 0 0 0 1px var(--danger); }


        .section-title { font-size: 1.15em; margin: 26px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--line); }
        .section-title:first-child { margin-top: 0; }

        .roster-row td { padding: 6px 10px; }
        .add-student-bar { display: flex; justify-content: flex-end; margin-top: 14px; }

        .class-name-field { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
        .class-name-field input[type=text] { padding: 8px 14px; border: 2px solid var(--line); border-radius: 10px; font-family: inherit; font-size: 1em; background: var(--surface); color: var(--text); width: 140px; }
        .class-name-field input[type=text]:focus { border-color: var(--accent); box-shadow: 0 0 8px 2px var(--focus-glow); outline: none; }

        .hint-text { color: var(--muted); font-size: 0.85em; margin: -6px 0 16px; }

        .add-col-bar { display: flex; justify-content: flex-end; margin-top: 12px; }

        .subject-manage-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
        .subject-manage-row:last-child { border-bottom: none; }
        .subject-add-form { display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
        .subject-add-form input[type=text] { padding: 8px 14px; border: 2px solid var(--line); border-radius: 10px; font-family: inherit; background: var(--surface); color: var(--text); }
        .subject-add-form select { padding: 8px 14px; border: 2px solid var(--line); border-radius: 10px; font-family: inherit; background: var(--surface); color: var(--text); }
    </style>
</head>
<body>
    <!-- ====== 版面骨架 ====== -->
    <header>
        <div class="header-inner">
            <div class="header-side"></div>
            <div class="header-title" data-gated>
                <h1><span id="appTitle">608</span>成績計算 <button id="editClassBtn" class="icon-btn admin-only hidden" title="修改班級名稱">✎</button></h1>
            </div>
            <div class="header-side header-actions">
                <button id="loginBtn" class="btn outline">登入</button>
                <button id="logoutBtn" class="btn outline hidden">登出</button>
            </div>
        </div>
    </header>

    <main id="content" data-gated>
        <!-- 未登入時顯示的內容：本 app 為班級成績登記工具，成績資料不對外公開，僅顯示提示 -->
    </main>

    <section id="adminArea" class="admin-only hidden" data-gated>
        <!-- 登入後才顯示的編輯區 -->
    </section>

    <!-- ====== 密碼彈窗（本 app 未使用，登入模式為 C，保留骨架不刪） ====== -->
    <div id="inputModal" class="modal-overlay">
        <div class="modal-content">
            <p class="modal-title">請輸入密碼</p>
            <input type="password" id="passInput" placeholder="密碼" autocomplete="off">
            <p id="imeHint" class="modal-hint">偵測到中文輸入法，密碼請切換為英數</p>
            <div class="modal-actions">
                <button class="btn-ok" onclick="checkPass()">確定</button>
                <button class="btn-cancel" onclick="closeModal()">取消</button>
            </div>
        </div>
    </div>

    <!-- ====== 通用提示框（取代原生 alert） ====== -->
    <div id="alertModal" class="modal-overlay">
        <div class="modal-content">
            <p class="modal-title" id="alertMsg"></p>
            <div class="modal-actions">
                <button class="btn-ok" onclick="closeAlert()">確定</button>
            </div>
        </div>
    </div>

    <!-- ====== 通用輸入框（取代原生 prompt；askInput 使用） ====== -->
    <div id="promptModal" class="modal-overlay">
        <div class="modal-content">
            <p class="modal-title" id="promptMsg"></p>
            <input type="text" id="promptInput" class="modal-input">
            <div class="modal-actions">
                <button class="btn-cancel" id="promptNo">取消</button>
                <button class="btn-ok" id="promptOk">確定</button>
            </div>
        </div>
    </div>

    <script type="module">
        /* =========================================================
           通用骨架：Firebase + 三種登入模式 + 通用資料層 + 載入 gate
           每支新 app 從此檔複製，只改「業務設定」與「業務邏輯」兩區。
           ========================================================= */
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut,
                 signInWithEmailAndPassword,
                 GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const $ = id => document.getElementById(id);

        /* ========== 業務設定（每支 app 改這裡） ========== */
        // apiKey 可公開（Firebase web key 為識別碼，非機密）；安全靠 Firestore 規則，勿試圖隱藏
        const firebaseConfig = {
            apiKey: "AIzaSyCzUhHZBYNyQ2B6wPGQCeQbZUhW5NOdpKg",
            authDomain: "class-grade-calculate.firebaseapp.com",
            projectId: "class-grade-calculate",
            storageBucket: "class-grade-calculate.firebasestorage.app",
            messagingSenderId: "257124882838",
            appId: "1:257124882838:web:96171c7d4f639cdb17a5b7"
        };
        const DOC_PATH = ["grades", "main"];   // Firestore 文件路徑
        const SAVE_MERGE = true;               // 逐欄位 merge，避免不同分頁的儲存互相覆蓋

        // 登入模式：'A'=共用帳號只輸密碼；'B'=綁 1 個 Google 帳號；'C'=綁 2 個 Google 帳號
        const LOGIN_MODE = 'C';
        const SHARED_EMAIL = "owner@example.com";
        const ALLOWED_EMAILS = ["annychen1210@gmail.com", "annychen1210@go.edu.tw"]; // 這 2 個帳號都能登入並看到同一份資料
        /* ================================================ */

        // 啟動前檢查 config 是否已填，未填則顯示提示而非白畫面崩潰
        if(!firebaseConfig.apiKey || !firebaseConfig.projectId){
            document.body.innerHTML = '<div style="max-width:520px;margin:80px auto;padding:24px;font-family:sans-serif;line-height:1.7;color:#332b24;text-align:center">尚未填入 Firebase 設定。<br>請在原始碼「業務設定」區的 <code>firebaseConfig</code> 填入你的專案設定後再開啟。</div>';
            throw new Error('firebaseConfig 未設定');
        }
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const ref = doc(db, ...DOC_PATH);

        let isAdmin = false, editorReady = false, dataArrived = false, errored = false, lastData = null;
        function showLoadError(){ if(!document.getElementById('loadError')){ const d=document.createElement('div'); d.id='loadError'; d.textContent='載入失敗，請重新整理頁面'; d.style.cssText='position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--danger);color:#fff;padding:10px 18px;border-radius:10px;z-index:2000;font-size:0.95em'; document.body.appendChild(d); } }

        /* ---------- 載入 gate ---------- */
        let readyTimer = setTimeout(markReady, 8000);
        function markReady(){ clearTimeout(readyTimer); document.body.classList.add("ready"); }

        function maybeLoadEditor(){ if(isAdmin && dataArrived && !editorReady) loadEditor(lastData); }

        /* ---------- 通用資料層 ---------- */
        function saveData(obj){ if(!isAdmin) return; setDoc(ref, obj, { merge: SAVE_MERGE }).catch(e=>console.warn(e)); }
        // 完整覆寫整份文件（不 merge）：僅用於「封存後清空成績」，因為 merge 無法真正清掉巢狀舊資料
        function saveDataFull(obj){ if(!isAdmin) return; setDoc(ref, obj, { merge: false }).catch(e=>console.warn(e)); }
        onSnapshot(ref, snap => {
            lastData = snap.exists() ? snap.data() : null;
            dataArrived = true;
            renderPublic(lastData, { error: errored });
            maybeLoadEditor(); markReady();
        }, err => { console.warn(err); errored = true; renderPublic(lastData, { error: true }); showLoadError(); markReady(); });

        function isAuthorized(user){
            if(!user) return false;
            if(LOGIN_MODE === 'A') return user.email === SHARED_EMAIL;
            if(LOGIN_MODE === 'B') return user.email === ALLOWED_EMAILS[0];
            if(LOGIN_MODE === 'C') return ALLOWED_EMAILS.slice(0,2).includes(user.email);
            return false;
        }
        onAuthStateChanged(auth, user => {
            isAdmin = isAuthorized(user);
            document.querySelectorAll('.admin-only').forEach(el => el.classList.toggle('hidden', !isAdmin));
            $('loginBtn').classList.toggle('hidden', !!user);
            $('logoutBtn').classList.toggle('hidden', !user);
            maybeLoadEditor();
        });

        window.showAlert = (msg) => { $('alertMsg').textContent = msg; $('alertModal').style.display = 'flex'; };
        window.closeAlert = () => { $('alertModal').style.display = 'none'; };

        window.askInput = (msg, def) => new Promise(res => {
            const m = $('promptModal'), inp = $('promptInput'), ok = $('promptOk'), no = $('promptNo');
            inp.style.display = '';
            $('promptMsg').textContent = msg; inp.value = def || '';
            m.style.display = 'flex'; setTimeout(() => { inp.focus(); inp.select(); }, 50);
            const done = v => { m.style.display = 'none'; ok.onclick = null; no.onclick = null; inp.onkeydown = null; res(v); };
            ok.onclick = () => done(inp.value);
            no.onclick = () => done(null);
            inp.onkeydown = e => { if(e.key === 'Enter') done(inp.value); else if(e.key === 'Escape') done(null); };
        });

        // 純確認框（無輸入欄），回傳 true/false
        window.askConfirm = (msg) => new Promise(res => {
            const m = $('promptModal'), inp = $('promptInput'), ok = $('promptOk'), no = $('promptNo');
            $('promptMsg').textContent = msg; inp.style.display = 'none';
            m.style.display = 'flex';
            const done = v => { m.style.display = 'none'; inp.style.display = ''; ok.onclick = null; no.onclick = null; res(v); };
            ok.onclick = () => done(true);
            no.onclick = () => done(false);
        });

        /* ---------- 登入 / 登出 ---------- */
        $('loginBtn').onclick = () => {
            if(LOGIN_MODE === 'A'){ window.openLogin(); }
            else { signInWithPopup(auth, new GoogleAuthProvider()).catch(e=>window.showAlert("登入失敗")); }
        };
        $('logoutBtn').onclick = () => signOut(auth);

        window.openLogin  = () => { $('passInput').value=''; $('imeHint').style.display='none'; $('inputModal').style.display='flex'; setTimeout(()=>$('passInput').focus(),50); };
        window.closeModal = () => { $('inputModal').style.display='none'; $('passInput').value=''; $('imeHint').style.display='none'; };
        window.checkPass  = async () => {
            const pw = $('passInput').value; if(!pw){ window.showAlert('請輸入密碼'); return; }
            try { await signInWithEmailAndPassword(auth, SHARED_EMAIL, pw); window.closeModal(); }
            catch(e){ window.showAlert("密碼錯誤"); $('passInput').value=''; $('passInput').focus(); }
        };
        const checkIME = () => { $('imeHint').style.display = /[^\x00-\x7F]/.test($('passInput').value) ? 'block' : 'none'; };
        $('passInput').addEventListener('keydown', e => { if(e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) window.checkPass(); });
        $('passInput').addEventListener('compositionstart', () => { $('imeHint').style.display='block'; });
        $('passInput').addEventListener('input', e => { if(!e.isComposing) checkIME(); });
        $('passInput').addEventListener('compositionend', checkIME);

        /* ========== 業務邏輯 ========== */

        // 有段考的固定科目（主科：平時+段考）
        const CORE_SUBJECTS = ['國語', '數學'];
        // 抽離：只有國語/數學可設定；抽離的學生不登記作業/平考/表現分數，改在平時分數頁手動輸入
        function isStudentPulledOut(student, subjectKey){ return CORE_SUBJECTS.includes(subjectKey) && !!(student.pullout && student.pullout[subjectKey]); }
        // 只登記段考分數、無平時明細的固定科目
        const EXAM_ONLY = ['自然', '社會', '英文'];
        const EXAM_SUBJECTS = [...CORE_SUBJECTS, ...EXAM_ONLY]; // 段考成績頁使用
        const EXAM_WEIGHT = { 國語: 5, 數學: 4, 自然: 3, 社會: 3, 英文: 2 };
        const PERIODS = { mid: '期中', final: '期末' };
        const CATEGORY_LABEL = { homework: '作業', quiz: '平考', perform: '上課表現' };
        const CATEGORY_KEYS = ['homework', 'quiz', 'perform'];

        const DEFAULT_CLASS_NAME = '608';
        const DEFAULT_STUDENTS = ['陳愷寬','盧信睿','蔡杰助','李秉澤','鍾丞崴','郭宥均','朱子安','葉峻榮','翁士賢','高以恩',
            '鄭宇凱','洪嘉威','顏翊達','張以柔','楊佩昕','王子芸','溫晨羽','宋梓瑜','姚可欣','許苙萲',
            '徐子晴','李妍蓁','施姵岑','方弈喬','陳以玹','王芊晴','陳宣蓉'].map((name, i) => ({ id: 's' + (i + 1), name }));

        function num(v){ const n = Number(v); return isNaN(n) ? 0 : n; }
        function fmt(n, d = 1){ return (Math.round(n * Math.pow(10, d)) / Math.pow(10, d)).toString(); }

        // 等第（依總分 0-100）
        function letterGrade(total){ if(total >= 90) return '優'; if(total >= 80) return '甲'; if(total >= 70) return '乙'; if(total >= 60) return '丙'; return '丁'; }
        // 努力程度：主科依平時 0-50 制門檻；無段考科目依 0-100 制門檻（比例相同、門檻加倍）
        function effortLevel50(daily50){ if(daily50 >= 45) return '優異'; if(daily50 >= 42.5) return '良好'; if(daily50 >= 40) return '尚可'; return '再加油'; }
        function effortLevel100(daily100){ if(daily100 >= 90) return '優異'; if(daily100 >= 85) return '良好'; if(daily100 >= 80) return '尚可'; return '再加油'; }

        function getLeaf(obj, key){ return obj && obj[key] !== undefined && obj[key] !== null && obj[key] !== '' ? Number(obj[key]) : null; }
        function deepSet(obj, path, value){ let o = obj; for(let i = 0; i < path.length - 1; i++){ if(!o[path[i]]) o[path[i]] = {}; o = o[path[i]]; } o[path[path.length - 1]] = value; }

        // 段考標準排名（等同 Excel RANK.EQ）：同分同名次，下一名次依人數往後跳
        function rankOf(value, allValues){ return 1 + allValues.filter(v => v > value).length; }

        function newId(prefix){ return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

        /* ---------- 科目清單（固定主科／段考科 + 自訂科目） ---------- */
        // 自訂科目結構：{ id, name, periodMode: 'split' | 'single', weights: {homework, perform} }（百分比，兩者相加建議 100）
        const DEFAULT_CUSTOM_WEIGHTS = { homework: 50, perform: 50 };
        function customSubjects(){ return state().subjects.custom; }
        // 平時成績頁可選的科目清單（含主科＋自訂科目），統一格式 {key,name,periodMode,hasExam,weights}
        function dailySubjectList(){
            return [
                ...CORE_SUBJECTS.map(name => ({ key: name, name, periodMode: 'split', hasExam: true })),
                ...customSubjects().map(c => ({ key: c.id, name: c.name, periodMode: c.periodMode, hasExam: false, weights: c.weights || DEFAULT_CUSTOM_WEIGHTS }))
            ];
        }
        function findDailySubject(key){ return dailySubjectList().find(s => s.key === key); }
        // 回傳計算平時分數用的加權比例（皆為 0-1 小數）；有段考的主科固定 0.4/0.4/0.2，無段考科目依設定的佔比（僅作業＋表現）
        function weightsForSubject(sub){
            if(sub.hasExam) return { homework: 0.4, quiz: 0.4, perform: 0.2 };
            const w = sub.weights || DEFAULT_CUSTOM_WEIGHTS;
            return { homework: (Number(w.homework) || 0) / 100, quiz: 0, perform: (Number(w.perform) || 0) / 100 };
        }

        /* ---------- 資料骨架初始化 ---------- */
        function emptyCategoryBucket(){ return { columns: [], values: {} }; }
        function ensureDailyBucket(subjectKey, periodKey){
            // 注意：假設 lastData 已由 state() 初始化過，這裡直接操作 lastData，避免與 state() 互相遞迴
            const sc = lastData.scores;
            if(!sc.daily[subjectKey]) sc.daily[subjectKey] = {};
            if(!sc.daily[subjectKey][periodKey]) sc.daily[subjectKey][periodKey] = {};
            const b = sc.daily[subjectKey][periodKey];
            CATEGORY_KEYS.forEach(cat => { if(!b[cat]) b[cat] = emptyCategoryBucket(); if(!b[cat].columns) b[cat].columns = []; if(!b[cat].values) b[cat].values = {}; });
            if(!b.manualDaily) b.manualDaily = {}; // 抽離學生的平時分數手動輸入值
            return b;
        }

        function state(){
            if(!lastData) lastData = {};
            if(!Array.isArray(lastData.students) || lastData.students.length === 0) lastData.students = DEFAULT_STUDENTS.map(s => ({ ...s }));
            if(!lastData.className) lastData.className = DEFAULT_CLASS_NAME;
            if(!lastData.subjects) lastData.subjects = {};
            if(!Array.isArray(lastData.subjects.custom)) lastData.subjects.custom = [];
            if(!Array.isArray(lastData.archives)) lastData.archives = [];
            if(!lastData.scores) lastData.scores = {};
            if(!lastData.scores.daily) lastData.scores.daily = {};
            if(!lastData.scores.examMid) lastData.scores.examMid = {};
            if(!lastData.scores.examFinal) lastData.scores.examFinal = {};
            // 確保所有目前已知科目都有骨架（含期中/期末或單一期）－直接用固定科目＋自訂科目清單，避免呼叫 dailySubjectList() 造成遞迴
            const subjectSkeletonList = [
                ...CORE_SUBJECTS.map(name => ({ key: name, periodMode: 'split' })),
                ...lastData.subjects.custom.map(c => ({ key: c.id, periodMode: c.periodMode }))
            ];
            subjectSkeletonList.forEach(sub => {
                if(sub.periodMode === 'split'){ ensureDailyBucket(sub.key, 'mid'); ensureDailyBucket(sub.key, 'final'); }
                else { ensureDailyBucket(sub.key, 'single'); }
            });
            return lastData;
        }

        function saveLeaf(path, value){ const o = {}; deepSet(o, path, value); saveData(o); deepSet(lastData, path, value); }

        // 類別平均：只平均「有填入」的欄位分數（0-100），皆未填則回傳 0（用於平時分數計算）
        function categoryAverage(bucket, sid){
            if(!bucket || !bucket.columns.length) return null;
            const vals = bucket.columns.map(c => getLeaf(bucket.values[sid], c.id)).filter(v => v !== null);
            if(!vals.length) return null;
            return vals.reduce((a, b) => a + b, 0) / vals.length;
        }
        // 平時分數(0-100) = 作業平均*w1 + 平考平均*w2 + 表現平均*w3（未填的類別以 0 計入加權；weights 未傳入時預設為主科的 0.4/0.4/0.2）
        function dailyScore100FromBucket(bucket, sid, weights){
            const w = weights || { homework: 0.4, quiz: 0.4, perform: 0.2 };
            const hw = categoryAverage(bucket.homework, sid);
            const qz = categoryAverage(bucket.quiz, sid);
            const pf = categoryAverage(bucket.perform, sid);
            return (hw || 0) * w.homework + (qz || 0) * w.quiz + (pf || 0) * w.perform;
        }
        // 抽離的學生改用手動輸入的平時分數；否則照常用作業/平考/表現算
        function effectiveDaily100(bucket, sid, weights, pulledOut){
            if(pulledOut) return getLeaf(bucket.manualDaily, sid) || 0;
            return dailyScore100FromBucket(bucket, sid, weights);
        }

        /* ---------- 未登入畫面 ---------- */

            }
        }

        /* ---------- 班級名稱：標題旁鉛筆按鈕 ---------- */
        $('editClassBtn').onclick = async () => {

        /* ---------- 登入後編輯區 ---------- */
        let activeTab = 'daily';
        let dailySubjectKey = '國語', dailyPeriod = 'mid', dailyCategoryTab = 'homework';
        let examPeriod = 'mid';

        function loadEditor(data){

        const TABS = [

        /* ---------- 平時成績（作業/平考/表現/彙總；沒有段考的科目不顯示平考） ---------- */
        function renderDailyPanel(el){
            const data = state();
            const subjects = dailySubjectList();
            if(!findDailySubject(dailySubjectKey)) dailySubjectKey = subjects[0].key;
            const sub = findDailySubject(dailySubjectKey);
            if(sub.periodMode === 'single') dailyPeriod = 'single';
            else if(dailyPeriod === 'single') dailyPeriod = 'mid';

            const catList = sub.hasExam ? ['homework', 'quiz', 'perform'] : ['homework', 'perform'];
            if(!catList.includes(dailyCategoryTab) && dailyCategoryTab !== '__summary') dailyCategoryTab = 'homework';

            el.innerHTML = `
                <div class="toolbar">
                    <label>科目</label>
                    <select id="dailySubjectSel">${subjects.map(s => `<option value="${s.key}" ${s.key === dailySubjectKey ? 'selected' : ''}>${s.name}</option>`).join('')}</select>
                    ${sub.periodMode === 'split' ? `
                    <label>期別</label>
                    <select id="dailyPeriodSel">${Object.entries(PERIODS).map(([k, v]) => `<option value="${k}" ${k === dailyPeriod ? 'selected' : ''}>${v}</option>`).join('')}</select>
                    ` : `<span class="hint-text" style="margin:0">此科目為一學期登記一次</span>`}
                </div>
                <div class="subtabs-row">
                    <div class="subtabs">
                        ${catList.map((cat, i) => `<button class="subtab-btn" data-cat="${cat}">${i + 1} ${CATEGORY_LABEL[cat]}</button>`).join('')}
                        <button class="subtab-btn" data-cat="__summary">${catList.length + 1} 平時分數</button>
                    </div>
                    <div class="subtabs-actions">
                        <button class="btn small" id="addItemBtn"></button>
                        <button class="btn small danger" id="clearScoresBtn"></button>
                    </div>
                </div>
                <div id="dailyCategoryArea"></div>
            `;
            el.querySelector('#dailySubjectSel').onchange = e => { dailySubjectKey = e.target.value; renderDailyPanel(el); };
            const periodSel = el.querySelector('#dailyPeriodSel');
            if(periodSel) periodSel.onchange = e => { dailyPeriod = e.target.value; renderDailyPanel(el); };

            el.querySelectorAll('.subtab-btn').forEach(b => b.onclick = () => { dailyCategoryTab = b.dataset.cat; renderDailyCategoryArea(el, sub); });
            renderDailyCategoryArea(el, sub);
        }

        function renderDailyCategoryArea(el, sub){
            el.querySelectorAll('.subtab-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === dailyCategoryTab));
            const area = el.querySelector('#dailyCategoryArea');
            const data = state();
            const bucket = ensureDailyBucket(dailySubjectKey, dailyPeriod);
            const addBtn = el.querySelector('#addItemBtn');
            const clearBtn = el.querySelector('#clearScoresBtn');

            if(dailyCategoryTab === '__summary'){
                addBtn.classList.add('hidden');
                clearBtn.classList.add('hidden');
                renderDailySummarySub(area, data, bucket, sub);
                return;
            }
            addBtn.classList.remove('hidden');
            addBtn.textContent = `＋ 新增${CATEGORY_LABEL[dailyCategoryTab]}項目`;
            addBtn.onclick = () => addDailyColumn(area, bucket, dailyCategoryTab, sub);
            clearBtn.classList.remove('hidden');
            clearBtn.textContent = `清空${CATEGORY_LABEL[dailyCategoryTab]}分數`;
            clearBtn.onclick = async () => {
                const catBucket = bucket[dailyCategoryTab];
                const ok = await askConfirm(`確定清空「${CATEGORY_LABEL[dailyCategoryTab]}」目前所有學生的分數？項目欄位會保留，此動作無法復原。`);
                if(ok){
                    catBucket.values = {};
                    saveLeaf(['scores', 'daily', dailySubjectKey, dailyPeriod, dailyCategoryTab, 'values'], {});
                    renderDailyCategorySub(area, data, bucket, dailyCategoryTab);
                }
            };
            renderDailyCategorySub(area, data, bucket, dailyCategoryTab);
        }

        async function addDailyColumn(area, bucket, cat, sub){
            const catBucket = bucket[cat];
            const name = await askInput(`請輸入${CATEGORY_LABEL[cat]}項目名稱`, `${CATEGORY_LABEL[cat]}${catBucket.columns.length + 1}`);
            if(name && name.trim()){
                catBucket.columns.push({ id: newId('c'), name: name.trim() });
                saveLeaf(['scores', 'daily', dailySubjectKey, dailyPeriod, cat, 'columns'], catBucket.columns);
                renderDailyCategorySub(area, state(), bucket, cat);
            }
        }

        function colBoxWidth(name){ return Math.max(70, name.length * 17 + 28); }

        function renderDailyCategorySub(area, data, bucket, cat){
            const catBucket = bucket[cat];
            area.innerHTML = `
                <p class="hint-text">每一欄可自訂名稱（例如「第1次習作」），成績以 0–100 分登記；學生的「平均」為該生已填欄位的平均分數。</p>
                <div class="table-wrap">
                    <table class="grid">
                        <thead><tr><th>姓名</th>${catBucket.columns.map(c => `<th><span class="col-name-wrap"><input type="text" data-col="${c.id}" value="${escapeHtml(c.name)}" style="width:${colBoxWidth(c.name)}px"><button class="col-del-btn" data-col="${c.id}" title="刪除此欄">✕</button></span></th>`).join('')}<th>平均</th></tr></thead>
                        <tbody id="catBody"></tbody>
                    </table>
                </div>
            `;
            const body = area.querySelector('#catBody');
            data.students.forEach(s => {
                const pulledOut = isStudentPulledOut(s, dailySubjectKey);
                const tr = document.createElement('tr');
                if(pulledOut){
                    tr.innerHTML = `<td class="name-cell">${escapeHtml(s.name)}</td>${catBucket.columns.map(() => `<td>－</td>`).join('')}<td class="derived">抽離</td>`;
                    body.appendChild(tr);
                    return;
                }
                const avg = categoryAverage(catBucket, s.id);
                tr.innerHTML = `<td class="name-cell">${escapeHtml(s.name)}</td>${catBucket.columns.map(c => `<td><input type="number" min="0" max="100" step="0.5" data-col="${c.id}" style="width:${colBoxWidth(c.name)}px" value="${getLeaf(catBucket.values[s.id], c.id) ?? ''}"></td>`).join('')}<td class="derived" data-f="avg">${avg !== null ? fmt(avg) : '-'}</td>`;
                catBucket.columns.forEach(c => {
                    const inp = tr.querySelector(`input[data-col="${c.id}"]`);
                    inp.oninput = () => {
                        const vals = catBucket.columns.map(cc => { const v = tr.querySelector(`input[data-col="${cc.id}"]`).value; return v === '' ? null : num(v); }).filter(v => v !== null);
                        tr.querySelector('[data-f=avg]').textContent = vals.length ? fmt(vals.reduce((a,b)=>a+b,0)/vals.length) : '-';
                    };
                    inp.onchange = e => {
                        const v = e.target.value;
                        if(!catBucket.values[s.id]) catBucket.values[s.id] = {};
                        catBucket.values[s.id][c.id] = v === '' ? null : num(v);
                        saveLeaf(['scores', 'daily', dailySubjectKey, dailyPeriod, cat, 'values', s.id], catBucket.values[s.id]);
                    };
                });
                body.appendChild(tr);
            });
            area.querySelectorAll('.col-del-btn').forEach(btn => btn.onclick = async () => {
                const ok = await askConfirm('確定刪除這一欄？');
                if(ok){
                    catBucket.columns = catBucket.columns.filter(c => c.id !== btn.dataset.col);
                    saveLeaf(['scores', 'daily', dailySubjectKey, dailyPeriod, cat, 'columns'], catBucket.columns);
                    renderDailyCategorySub(area, data, bucket, cat);
                }
            });
            area.querySelectorAll('th input[type=text]').forEach(inp => {
                inp.oninput = () => { inp.style.width = colBoxWidth(inp.value) + 'px'; };
                inp.onchange = e => {
                    const colId = inp.dataset.col;
                    const col = catBucket.columns.find(c => c.id === colId);
                    if(col){ col.name = e.target.value.trim() || col.name; saveLeaf(['scores', 'daily', dailySubjectKey, dailyPeriod, cat, 'columns'], catBucket.columns); }
                    // 名稱變了，重繪整張表讓分數欄寬度也跟著同步對齊
                    renderDailyCategorySub(area, data, bucket, cat);
                };
            });
        }

        function renderDailySummarySub(area, data, bucket, sub){
            const weights = weightsForSubject(sub);
            const weightEditor = sub.hasExam ? '' : `
                <div class="toolbar" style="margin-bottom:10px">
                    <label>作業佔比</label>
                    <input type="number" id="wHomework" min="0" max="100" step="1" value="${weights.homework * 100}" style="width:70px;padding:6px 8px;border:2px solid var(--line);border-radius:8px;text-align:center;font-family:inherit">%
                    <label>上課表現佔比</label>
                    <input type="number" id="wPerform" min="0" max="100" step="1" value="${weights.perform * 100}" style="width:70px;padding:6px 8px;border:2px solid var(--line);border-radius:8px;text-align:center;font-family:inherit">%
                </div>
            `;
            const formulaText = sub.hasExam
                ? '平時分數 ＝ 作業平均×0.4 ＋ 平考平均×0.4 ＋ 上課表現平均×0.2（抽離學生改為手動輸入）'
                : `平時分數 ＝ 作業平均×${fmt(weights.homework)} ＋ 上課表現平均×${fmt(weights.perform)}`;
            area.innerHTML = `
                ${weightEditor}
                <p class="hint-text">${formulaText}</p>
                <div class="table-wrap">

                        <tbody>${data.students.map(s => {

                            if(pulledOut){
                                const manualVal = getLeaf(bucket.manualDaily, s.id);
                                return `<tr><td class="name-cell">${escapeHtml(s.name)}</td><td>－</td>${sub.hasExam ? '<td>－</td>' : ''}<td>－</td><td><input type="number" class="manual-daily-input" data-sid="${s.id}" min="0" max="100" step="0.5" value="${manualVal ?? ''}"></td></tr>`;
                            }
                            const hw = categoryAverage(bucket.homework, s.id);
                            const qz = categoryAverage(bucket.quiz, s.id);
                            const pf = categoryAverage(bucket.perform, s.id);
                            const total = dailyScore100FromBucket(bucket, s.id, weights);
                            return `<tr><td class="name-cell">${escapeHtml(s.name)}</td><td>${hw !== null ? fmt(hw) : '-'}</td>${sub.hasExam ? `<td>${qz !== null ? fmt(qz) : '-'}</td>` : ''}<td>${pf !== null ? fmt(pf) : '-'}</td><td class="derived">${fmt(total)}</td></tr>`;
                        }).join('')}</tbody>
                    </table>
                </div>
            `;
            area.querySelectorAll('.manual-daily-input').forEach(inp => inp.onchange = e => {
                const v = e.target.value;
                bucket.manualDaily[inp.dataset.sid] = v === '' ? null : num(v);
                saveLeaf(['scores', 'daily', dailySubjectKey, dailyPeriod, 'manualDaily', inp.dataset.sid], bucket.manualDaily[inp.dataset.sid]);
            });
            if(!sub.hasExam){
                const saveWeights = () => {
                    const hwPct = num(area.querySelector('#wHomework').value);
                    const pfPct = num(area.querySelector('#wPerform').value);
                    const custom = customSubjects();
                    const rec = custom.find(c => c.id === sub.key);
                    if(rec){
                        rec.weights = { homework: hwPct, perform: pfPct };
                        saveLeaf(['subjects', 'custom'], custom);
                        renderDailySummarySub(area, data, bucket, findDailySubject(sub.key));
                    }
                };
                area.querySelector('#wHomework').onchange = saveWeights;
                area.querySelector('#wPerform').onchange = saveWeights;
            }
        }


        /* ---------- 段考成績 ---------- */
        function renderExamPanel(el){
            const data = state();
            el.innerHTML = `
                <p class="hint-text">加權總分 ＝ 國語×5＋數學×4＋自然×3＋社會×3＋英文×2（用於班排名，比重沿用原始段考表）</p>
                <div class="toolbar">
                    <label>期別</label>
                    <select id="examPeriodSel">${Object.entries(PERIODS).map(([k, v]) => `<option value="${k}" ${k === examPeriod ? 'selected' : ''}>${v}</option>`).join('')}</select>
                </div>
                <div class="table-wrap">
                    <table class="grid">
                        <thead><tr><th>姓名</th>${EXAM_SUBJECTS.map(s => `<th>${s}</th>`).join('')}<th>加權總分</th><th>排名</th></tr></thead>

            el.querySelector('#examPeriodSel').onchange = e => { examPeriod = e.target.value; renderExamPanel(el); };

            const bucketKey = examPeriod === 'mid' ? 'examMid' : 'examFinal';
            const body = el.querySelector('#examBody');
            const bucket = data.scores[bucketKey];

            function weightedTotal(sid){
                return EXAM_SUBJECTS.reduce((sum, sub) => sum + (getLeaf(bucket[sid], sub) || 0) * EXAM_WEIGHT[sub], 0);
            }
            const allTotals = data.students.map(s => weightedTotal(s.id));

            data.students.forEach((s, idx) => {
                const rec = bucket[s.id] || {};
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="name-cell">${escapeHtml(s.name)}</td>
                    ${EXAM_SUBJECTS.map(sub => `<td><input type="number" min="0" max="100" step="0.5" data-sub="${sub}" value="${getLeaf(rec, sub) ?? ''}"></td>`).join('')}
                    <td class="derived" data-f="total">${fmt(allTotals[idx])}</td>
                    <td class="rank-cell" data-f="rank">${rankOf(allTotals[idx], allTotals)}</td>
                `;
                EXAM_SUBJECTS.forEach(sub => {
                    const inp = tr.querySelector(`[data-sub="${sub}"]`);
                    const recalcRow = () => {
                        const vals = EXAM_SUBJECTS.map(k => num(tr.querySelector(`[data-sub="${k}"]`).value));
                        const total = EXAM_SUBJECTS.reduce((sum, k, i) => sum + vals[i] * EXAM_WEIGHT[k], 0);
                        tr.querySelector('[data-f=total]').textContent = fmt(total);
                    };
                    inp.oninput = recalcRow;
                    inp.onchange = e => {
                        saveLeaf(['scores', bucketKey, s.id, sub], num(e.target.value));
                        renderExamPanel(el);
                    };
                });
                body.appendChild(tr);
            });
        }

        /* ---------- 學期總成績（唯讀彙總；不含自然/社會/英文；用按鈕切換科目） ---------- */
        let summarySubjectKey = null;
        function summarySubjectList(){
            return [
                ...CORE_SUBJECTS.map(name => ({ key: name, name, isCore: true })),
                ...customSubjects().map(c => ({ key: c.id, name: c.name, isCore: false, periodMode: c.periodMode }))
            ];
        }
        function renderSummaryPanel(el){
            const data = state();
            const list = summarySubjectList();
            if(!list.length){ el.innerHTML = '<p class="empty-note">尚無科目資料</p>'; return; }
            if(!summarySubjectKey || !list.some(s => s.key === summarySubjectKey)) summarySubjectKey = list[0].key;

            el.innerHTML = `
                <div class="subtabs">${list.map(s => `<button class="subtab-btn" data-sub="${s.key}">${escapeHtml(s.name)}</button>`).join('')}</div>
                <div id="summaryTableArea"></div>
            `;
            el.querySelectorAll('.subtab-btn').forEach(b => b.onclick = () => { summarySubjectKey = b.dataset.sub; renderSummaryTable(el); });
            renderSummaryTable(el);
        }

        function renderSummaryTable(el){
            el.querySelectorAll('.subtab-btn').forEach(b => b.classList.toggle('active', b.dataset.sub === summarySubjectKey));
            const area = el.querySelector('#summaryTableArea');
            const data = state();
            const sc = data.scores;
            const sub = summarySubjectList().find(s => s.key === summarySubjectKey);
            let html = '';

            if(sub.isCore){
                // 主科：分開列出期中/期末的平時與段考，再算學期總分（各占 25%）
                html += `<p class="hint-text">總分 ＝ 期中平時×0.25 ＋ 期末平時×0.25 ＋ 期中段考×0.25 ＋ 期末段考×0.25</p>
                <div class="table-wrap"><table class="grid">
                <thead><tr><th>姓名</th><th>期中平時</th><th>期末平時</th><th>期中段考</th><th>期末段考</th><th>總分</th><th>等第</th><th>努力程度</th></tr></thead>
                <tbody>`;
                const midBucket = ensureDailyBucket(sub.key, 'mid');
                const finalBucket = ensureDailyBucket(sub.key, 'final');
                data.students.forEach(s => {
                    const pulledOut = isStudentPulledOut(s, sub.key);
                    const midDaily = effectiveDaily100(midBucket, s.id, undefined, pulledOut);
                    const finalDaily = effectiveDaily100(finalBucket, s.id, undefined, pulledOut);
                    const examMid = getLeaf(sc.examMid[s.id], sub.key) || 0;
                    const examFinal = getLeaf(sc.examFinal[s.id], sub.key) || 0;
                    const total = (midDaily + finalDaily + examMid + examFinal) * 0.25;
                    const d50 = (midDaily + finalDaily) / 4; // 用於努力程度門檻（0-50 制）
                    html += `<tr><td class="name-cell">${escapeHtml(s.name)}</td><td>${fmt(midDaily)}</td><td>${fmt(finalDaily)}</td><td>${fmt(examMid)}</td><td>${fmt(examFinal)}</td><td class="derived">${fmt(total)}</td><td>${letterGrade(total)}</td><td>${effortLevel50(d50)}</td></tr>`;
                });
                html += `</tbody></table></div>`;
            } else {
                // 自訂科目：只有平時，無段考
                html += `<div class="table-wrap"><table class="grid">
                <thead><tr><th>姓名</th><th>平時分數</th><th>等第</th><th>努力程度</th></tr></thead>
                <tbody>`;
                data.students.forEach(s => {
                    let total;
                    const custRec = customSubjects().find(c => c.id === sub.key);
                    const weights = weightsForSubject({ hasExam: false, weights: custRec && custRec.weights });
                    if(sub.periodMode === 'split'){
                        const midBucket = ensureDailyBucket(sub.key, 'mid');
                        const finalBucket = ensureDailyBucket(sub.key, 'final');
                        total = (dailyScore100FromBucket(midBucket, s.id, weights) + dailyScore100FromBucket(finalBucket, s.id, weights)) / 2;
                    } else {
                        const bucket = ensureDailyBucket(sub.key, 'single');
                        total = dailyScore100FromBucket(bucket, s.id, weights);
                    }
                    html += `<tr><td class="name-cell">${escapeHtml(s.name)}</td><td class="derived">${fmt(total)}</td><td>${letterGrade(total)}</td><td>${effortLevel100(total)}</td></tr>`;
                });
                html += `</tbody></table></div>`;
            }
            area.innerHTML = html;
        }

        /* ---------- 學生名單（第 4 頁）＋ 科目管理 ---------- */
        function renderRosterPanel(el){
            const data = state();
            el.innerHTML = `
                <div class="section-title" style="margin-top:0">學生名單</div>
                <p class="hint-text">「抽離」勾選後，該生在國語／數學的作業、平考、上課表現不會出現分數欄，改在該科的「平時分數」子頁手動輸入平時分數。</p>
                <div class="table-wrap">
                    <table class="grid">
                        <thead><tr><th>座號</th><th>姓名</th>${CORE_SUBJECTS.map(sub => `<th>${sub}抽離</th>`).join('')}<th>操作</th></tr></thead>
                        <tbody id="rosterBody"></tbody>
                    </table>
                </div>
                <div class="add-student-bar"><button class="btn" id="addStudentBtn">＋ 新增學生</button></div>

                <div class="section-title">科目管理</div>
                <p class="hint-text">國語、數學、自然、社會、英文為固定科目。其餘授課科目（例如健康、綜合、彈性課程等）可在此新增，僅登記平時成績。</p>
                <div id="subjectList"></div>
                <div class="subject-add-form">
                    <input type="text" id="newSubjectName" placeholder="新科目名稱">
                    <select id="newSubjectMode">
                        <option value="split">分期中／期末登記</option>
                        <option value="single">一學期登記一次</option>
                    </select>
                    <button class="btn small" id="addSubjectBtn">＋ 新增科目</button>
                </div>

                <div class="section-title">學期封存</div>
                <p class="hint-text">封存會把目前的學生名單、科目設定與所有成績存成一份快照（不會影響目前資料）。封存後可選擇是否清空目前成績以開始新學期，學生名單與科目設定則會保留。</p>
                <button class="btn" id="archiveBtn">📦 封存學期紀錄</button>
                <div id="archiveListArea" style="margin-top:14px"></div>
            `;
            const body = el.querySelector('#rosterBody');
            data.students.forEach((s, idx) => {
                const tr = document.createElement('tr');
                tr.className = 'roster-row';
                tr.innerHTML = `<td>${idx + 1}</td><td><input type="text" value="${escapeHtml(s.name)}"></td>${CORE_SUBJECTS.map(sub => `<td><input type="checkbox" data-pullout="${sub}" ${s.pullout && s.pullout[sub] ? 'checked' : ''}></td>`).join('')}<td><button class="btn danger small">刪除</button></td>`;
                tr.querySelector('input[type=text]').onchange = e => {
                    s.name = e.target.value.trim() || s.name;
                    saveLeaf(['students'], data.students);
                    refreshAllPanels();
                };
                CORE_SUBJECTS.forEach(sub => {
                    tr.querySelector(`input[data-pullout="${sub}"]`).onchange = e => {
                        if(!s.pullout) s.pullout = {};
                        s.pullout[sub] = e.target.checked;
                        saveLeaf(['students'], data.students);
                        refreshAllPanels();
                    };
                });
                tr.querySelector('button').onclick = async () => {
                    const ok = await askConfirm(`確定刪除「${s.name}」？`);
                    if(ok){
                        data.students = data.students.filter(x => x.id !== s.id);
                        saveLeaf(['students'], data.students);
                        renderRosterPanel(el);
                        refreshAllPanels();
                    }
                };
                body.appendChild(tr);
            });
            el.querySelector('#addStudentBtn').onclick = async () => {
                const name = await askInput('請輸入新學生姓名', '');
                if(name && name.trim()){
                    data.students.push({ id: newId('s'), name: name.trim() });
                    saveLeaf(['students'], data.students);
                    renderRosterPanel(el);
                    refreshAllPanels();
                }
            };

            const subjList = el.querySelector('#subjectList');
            if(!data.subjects.custom.length){
                subjList.innerHTML = '<p class="hint-text" style="margin:0 0 8px">尚未新增其他科目。</p>';
            } else {
                subjList.innerHTML = data.subjects.custom.map(c => `
                    <div class="subject-manage-row">
                        <strong>${escapeHtml(c.name)}</strong>
                        <span class="hint-text" style="margin:0">（${c.periodMode === 'split' ? '分期中／期末' : '一學期一次'}）</span>
                        <button class="btn danger small" data-del="${c.id}">刪除科目</button>
                    </div>
                `).join('');
                subjList.querySelectorAll('[data-del]').forEach(btn => btn.onclick = async () => {
                    const c = data.subjects.custom.find(x => x.id === btn.dataset.del);
                    const ok = await askConfirm(`確定刪除科目「${c.name}」？此科目已登記的成績也會一併移除。`);
                    if(ok){
                        data.subjects.custom = data.subjects.custom.filter(x => x.id !== c.id);
                        delete data.scores.daily[c.id];
                        saveData({ subjects: { custom: data.subjects.custom }, scores: { daily: { [c.id]: null } } });
                        renderRosterPanel(el);
                        refreshAllPanels();
                    }
                });
            }
            el.querySelector('#addSubjectBtn').onclick = () => {
                const nameInp = el.querySelector('#newSubjectName');
                const modeSel = el.querySelector('#newSubjectMode');
                const name = nameInp.value.trim();
                if(!name){ window.showAlert('請輸入科目名稱'); return; }
                if(CORE_SUBJECTS.includes(name) || EXAM_ONLY.includes(name) || data.subjects.custom.some(c => c.name === name)){ window.showAlert('已有相同名稱的科目'); return; }
                data.subjects.custom.push({ id: newId('subj'), name, periodMode: modeSel.value });
                saveLeaf(['subjects', 'custom'], data.subjects.custom);
                nameInp.value = '';
                renderRosterPanel(el);
                refreshAllPanels();
            };

            const archiveArea = el.querySelector('#archiveListArea');
            const archives = Array.isArray(data.archives) ? data.archives : [];
            if(!archives.length){
                archiveArea.innerHTML = '<p class="hint-text" style="margin:0">尚無封存紀錄。</p>';
            } else {
                archiveArea.innerHTML = `<div class="table-wrap"><table class="grid">
                    <thead><tr><th>名稱</th><th>封存時間</th></tr></thead>
                    <tbody>${archives.slice().reverse().map(a => `<tr><td>${escapeHtml(a.name)}</td><td>${new Date(a.archivedAt).toLocaleString('zh-TW')}</td></tr>`).join('')}</tbody>
                </table></div>
                <p class="hint-text">目前版本僅保留封存快照，尚未提供還原/查閱介面；如需要可以再請我加上。</p>`;
            }
            el.querySelector('#archiveBtn').onclick = async () => {
                const name = await askInput('請輸入本次封存的學期紀錄名稱', '');
                if(!name || !name.trim()) return;
                const entry = {
                    id: newId('arc'),
                    name: name.trim(),
                    archivedAt: new Date().toISOString(),
                    snapshot: JSON.parse(JSON.stringify({ students: data.students, subjects: data.subjects, scores: data.scores }))
                };
                data.archives = archives.concat([entry]);
                saveLeaf(['archives'], data.archives);

                const doClear = await askConfirm(`已封存「${entry.name}」。是否清空目前所有成績以開始新學期？（學生名單與科目設定會保留，此動作無法復原）`);
                if(doClear){
                    data.scores = { daily: {}, examMid: {}, examFinal: {} };
                    saveDataFull({ className: data.className, students: data.students, subjects: data.subjects, archives: data.archives, scores: data.scores });
                } else {
                    window.showAlert('已封存，目前成績維持不變');
                }
                renderRosterPanel(el);
                refreshAllPanels();
            };
        }

        function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
        /* ========================================================= */
    </script>
</body>
</html>
